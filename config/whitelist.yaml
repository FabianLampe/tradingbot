# Whitelist of trusted sources.
# Add/remove freely — modules read this file at runtime, no code change needed.
# Rule of thumb: only sources with track-record AND signal/noise > 0.

twitter:
  # Breaking-news / market-moving accounts (real-time)
  - DeItaone           # Live News by Walter Bloomberg — institutional standard
  - FirstSquawk        # Real-time newswire
  - LiveSquawk         # Same niche
  - markets            # Bloomberg Markets
  - business           # Bloomberg Business
  - Reuters
  - ReutersBiz
  - WSJmarkets
  - CNBC
  - FT
  # Macro / Fed
  - federalreserve
  - NickTimiraos       # WSJ Fed reporter, often first
  - SteveLiesman       # CNBC Fed reporter
  # Avoid: pump accounts, crypto-shills, anonymous "alpha" accounts

reddit:
  # Discussion quality > volume
  - stocks
  - investing
  - SecurityAnalysis
  - ValueInvesting
  - options
  - StockMarket
  # Explicitly EXCLUDED (pump/manipulation): wallstreetbets, pennystocks,
  # CryptoMoonShots, SatoshiStreetBets

news_outlets:
  # Tier 1 (institutional, fact-driven)
  - reuters.com
  - bloomberg.com
  - ft.com
  - wsj.com
  - economist.com
  # Tier 2 (good market coverage, mostly free RSS)
  - marketwatch.com
  - cnbc.com
  - finance.yahoo.com
  - seekingalpha.com
  - barrons.com
  # Regulatory / official
  - sec.gov
  - federalreserve.gov
  - bls.gov
  - bea.gov

# Outlets we explicitly DOWN-WEIGHT or skip in sentiment scoring
news_outlets_blacklist:
  - benzinga.com       # often algorithmic, low signal
  - zacks.com          # template articles
  # Add: any outlet that produces near-identical articles for many tickers

# RSS-Feed-URLs pro Outlet (src/data/rss_news.py).
# Nur Domains aus `news_outlets` werden abgerufen. Fehlt eine Domain hier,
# greift die eingebaute Default-Map in rss_news.DEFAULT_FEEDS. Feed umgezogen
# oder tot? -> hier überschreiben, kein Code-Change nötig.
rss_feeds:
  reuters.com:
    - https://www.reutersagency.com/feed/?best-topics=business-finance&post_type=best
  bloomberg.com:
    - https://feeds.bloomberg.com/markets/news.rss
  ft.com:
    - https://www.ft.com/rss/home
  wsj.com:
    - https://feeds.a.dj.com/rss/RSSMarketsMain.xml
  economist.com:
    - https://www.economist.com/finance-and-economics/rss.xml
  marketwatch.com:
    - https://feeds.content.dowjones.io/public/rss/mw_topstories
  cnbc.com:
    - https://www.cnbc.com/id/100003114/device/rss/rss.html   # Top News
    - https://www.cnbc.com/id/20910258/device/rss/rss.html    # Markets
  finance.yahoo.com:
    - https://finance.yahoo.com/news/rssindex
  seekingalpha.com:
    - https://seekingalpha.com/market_currents.xml
  barrons.com:
    - https://feeds.a.dj.com/rss/RSSBarronsMarketsMain.xml
  sec.gov:
    - https://www.sec.gov/news/pressreleases.rss
  federalreserve.gov:
    - https://www.federalreserve.gov/feeds/press_all.xml
  bls.gov:
    - https://www.bls.gov/feed/bls_latest.rss
  bea.gov:
    - https://www.bea.gov/rss.xml
